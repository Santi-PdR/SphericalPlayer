name: Forge 1.20.1 build
on:
  push:
    branches: [main, "port/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: chmod +x gradlew && ./gradlew --no-daemon build
      - name: Install headless graphics
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Smoke test client and mixin startup
        shell: bash
        run: |
          set +e
          timeout 180s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null ./gradlew --no-daemon runClient > client.log 2>&1
          status=$?
          set -e
          tail -n 100 client.log
          if [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          grep -q "Sound engine started" run/logs/latest.log
      - uses: actions/upload-artifact@v4
        with:
          name: sphericalplayer-forge-1.20.1
          path: build/libs/*-1.20.1-v1.3.1.jar
          if-no-files-found: error
